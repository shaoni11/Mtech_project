# Paths are relative to this deep_learning_project directory.

processed_data_dir: "../multimodal_datapipeline/data/processed"
pipeline_output_dir: "../multimodal_datapipeline/dataset_pipeline_output"

primary_molecule_protein_table: "../multimodal_datapipeline/data/processed/baseline_4_molecule_protein.csv"
molecule_only_table: "../multimodal_datapipeline/data/processed/chembl_molecule_curated.csv"
protein_only_table: "../multimodal_datapipeline/data/processed/baseline_2_protein_only.csv"

alphafold_metadata: "../multimodal_datapipeline/dataset_pipeline_output/alphafold/metadata.csv"
alphafold_structure_dir: "../multimodal_datapipeline/dataset_pipeline_output/alphafold/structures"

image_only_table: "../multimodal_datapipeline/data/processed/baseline_3_image_only.csv"
molecule_image_table: "../multimodal_datapipeline/data/processed/baseline_5_molecule_image.csv"

output_dir: "experiments"
report_dir: "reports"

task:
  primary: "molecule_protein_activity_classification"
  label_column: "label"
  regression_column: "median_pchembl"
  activity_threshold_pchembl: 6.0

model:
  molecule_encoder: "morgan_fingerprint_mlp"
  protein_encoder_first: "esm2_embedding_mlp"
  protein_encoder_lightweight: "hashed_amino_acid_kmer_mlp"
  protein_encoder_structure: "alphafold_contact_map_cnn"
  fusion: "concat_mlp"

evaluation:
  primary_metrics:
    - "roc_auc"
    - "pr_auc"
    - "f1"
    - "balanced_accuracy"
  splits:
    - "random"
    - "scaffold"
    - "leave_one_target_out"
